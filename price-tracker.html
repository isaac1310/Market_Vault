/* ============================================================
   DESIGN TOKENS — variable names are semantic roles, not colors:
   --amber = primary accent, --green = positive/best, --rust = danger.
   Themes override VALUES only (see html[data-theme="wopr"] below).
   ============================================================ */
:root {
  --bg: #0b0f0a;
  --bg-panel: #10150e;
  --bg-raised: #161c13;
  --amber: #ffb347;
  --amber-bright: #ffd27a;
  --amber-dim: #a68d5c;
  --green: #7fb069;
  --green-bright: #a8d98e;
  --rust: #e0603a;
  --line: #4d3d1a;
  --line-soft: #2a3324;
  --glow: rgba(255, 179, 71, .45);
  --scanline-tint: rgba(0, 0, 0, .28);
  --bevel: none;
  --best-wash: rgba(127, 176, 105, .06);
  --best-on: #0b0f0a;
  --hover-wash: rgba(255, 179, 71, .07);
  --active-wash: rgba(255, 179, 71, .12);
  --panel-face: linear-gradient(180deg, #161c11, #0e120b);
  /* rounded 50s device shell; WOPR overrides these to sharp/cut corners */
  --radius: 12px;
  --radius-card: 18px;
  --radius-pill: 16px;
  --radius-search: 22px;
  --radius-tab: 14px;
  --cut: none;
  /* System stacks only — no webfont request, so the app stays offline and
     private. Hebrew UI in sans; every number in mono with tabular figures. */
  --sans: "IBM Plex Sans Hebrew", system-ui, -apple-system, "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color-scheme: dark;
}
/* WOPR — 80s war-room terminal. Body text is light warm rose (saturated
   red at paragraph size blooms on AMOLED); pure red is for accents. */
html[data-theme="wopr"] {
  --bg: #0a0507;
  --bg-panel: #140a0c;
  --bg-raised: #1c0e10;
  --amber: #ffc0b4;
  --amber-bright: #ff7a6c;
  --amber-dim: #d3a79f;
  --green: #ffd9b0;
  --green-bright: #ffe6c7;
  --rust: #ff3b30;
  --line: #6b2320;
  --line-soft: #3a1517;
  --glow: rgba(255, 59, 48, .5);
  --scanline-tint: rgba(20, 0, 0, .32);
  --bevel: inset 1px 1px 0 rgba(255, 255, 255, .06), inset -1px -1px 0 rgba(0, 0, 0, .6);
  --best-wash: rgba(255, 217, 176, .07);
  --best-on: #2a0f08;
  --hover-wash: rgba(255, 59, 48, .10);
  --active-wash: rgba(255, 59, 48, .14);
  --panel-face: linear-gradient(180deg, #1c0e10, #0a0507);
  /* 80s hardware: sharp everywhere, corners physically cut */
  --radius: 0px;
  --radius-card: 0px;
  --radius-pill: 0px;
  --radius-search: 0px;
  --radius-tab: 0px;
  --cut: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
/* HUB — the Family TravelHub language from the original app: warm cream
   surfaces, coral brand, soft shadows and pill shapes. The calm daylight
   option next to SLIP's printed-receipt look. */
html[data-theme="hub"] {
  --bg: #fbf7f3;
  --bg-panel: #ffffff;
  --bg-raised: #fbf1e8;
  --amber: #33302e;          /* body text */
  --amber-bright: #2c2a28;   /* headings, prices */
  --amber-dim: #6e655e;      /* darkened from TravelHub #9a9089 to clear AA on white */
  --green: #3f9b7c;
  --green-bright: #2f7a60;
  --rust: #bd3f3b;           /* darkened from #d9534f to clear AA on white */
  --line: #e4d8cc;
  --line-soft: #efe6dd;
  --glow: transparent;
  --scanline-tint: transparent;
  --bevel: none;
  --best-wash: rgba(63, 155, 124, .08);
  --best-on: #ffffff;
  --hover-wash: rgba(239, 142, 127, .08);
  --active-wash: rgba(239, 142, 127, .16);
  --panel-face: linear-gradient(180deg, #ffffff, #fbf7f3);
  --brand: #ef8e7f;
  --radius: 12px; --radius-card: 16px; --radius-pill: 999px;
  --radius-search: 999px; --radius-tab: 12px;
  --cut: none;
  color-scheme: light;
}
/* no CRT texture on this one at all */
html[data-theme="hub"] body::after { display: none; }
html[data-theme="hub"] .haze, html[data-theme="hub"] .grid-fx { display: none; }
html[data-theme="hub"] .card {
  border: 1px solid var(--line-soft);
  box-shadow: 0 4px 16px rgba(70, 45, 30, .06);
}
html[data-theme="hub"] .card__name { font-weight: 600; }
html[data-theme="hub"] input, html[data-theme="hub"] textarea, html[data-theme="hub"] select {
  background: #fff; border: 1px solid var(--line); box-shadow: none;
}
html[data-theme="hub"] input:focus-visible, html[data-theme="hub"] textarea:focus-visible {
  outline: none; box-shadow: 0 0 0 3px rgba(239, 142, 127, .35);
}
html[data-theme="hub"] .btn { border-radius: 999px; }
html[data-theme="hub"] .btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
html[data-theme="hub"] .btn--primary:hover { background: #e87a6a; border-color: #e87a6a; }
html[data-theme="hub"] .pill { background: #fff; border: 1px solid var(--line-soft); color: var(--amber-dim); }
html[data-theme="hub"] .pill[aria-pressed="true"] {
  background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600;
}
html[data-theme="hub"] .badge { border-radius: 999px; padding: 2px 9px; }
html[data-theme="hub"] .badge--best { background: var(--green); border-color: var(--green); color: #fff; }
html[data-theme="hub"] .badge--sale { background: #fdeeec; border-color: #f3c9c7; color: var(--rust); }
html[data-theme="hub"] .badge--warn {
  background: #fdf1e2; border-color: #f0dcc0; color: #9a7440;
}
html[data-theme="hub"] .entry { border-bottom: 1px solid var(--line-soft); }
html[data-theme="hub"] .entry--best { border-inline-start: 3px solid var(--green); }
html[data-theme="hub"] .appbar { border-bottom: 1px solid var(--line-soft); box-shadow: 0 1px 3px rgba(70,45,30,.04); }
html[data-theme="hub"] .appbar__brand { color: var(--brand); font-weight: 700; letter-spacing: .02em; }
html[data-theme="hub"] .leds { display: none; }
html[data-theme="hub"] .tabbar { border-top: 1px solid var(--line-soft); }
html[data-theme="hub"] .tabbar button[aria-current="page"] {
  background: rgba(239, 142, 127, .12); color: var(--brand); font-weight: 600; box-shadow: none;
}
html[data-theme="hub"] .fab {
  background: var(--brand); color: #fff; border: 0; border-radius: 50%;
  box-shadow: 0 8px 22px rgba(239, 142, 127, .45);
}
html[data-theme="hub"] .add-row { color: var(--brand); border-top: 1px dashed var(--line); }
html[data-theme="hub"] .toast { background: #fff; border: 1px solid var(--line); box-shadow: 0 14px 40px rgba(70,45,30,.16); }
.swatch--hub { background: linear-gradient(135deg, #fbf7f3 45%, #ef8e7f 45% 70%, #3f9b7c 70%); }

/* SLIP theme — daylight paper. Same DOM and layout as the dark themes;
   only tokens and a few printed ornaments differ. */
html[data-theme="slip"] {
  --bg: #e9e2d2;
  --bg-panel: #f4efe2;
  --bg-raised: #fbf7ec;
  --amber: #2a2620;          /* ink */
  --amber-bright: #1f1b16;
  /* darkened from the spec's #7a6f5a / #c8402a: on #f4efe2 those measured
     4.30:1 and 4.33:1, just under the 4.5:1 the same spec asks for */
  --amber-dim: #6b6150;
  --green: #3e7a4e;
  --green-bright: #2f5c3b;
  --rust: #b0341f;           /* stamp red */
  --line: #2a2620;
  --line-soft: #d8cfb8;
  --line-dash: #b8ad94;
  --glow: transparent;       /* no phosphor on paper */
  --scanline-tint: transparent;
  --bevel: none;
  --best-wash: rgba(62, 122, 78, .07);
  --best-on: #f4efe2;
  --hover-wash: rgba(42, 38, 32, .06);
  --active-wash: rgba(200, 64, 42, .10);
  --panel-face: linear-gradient(180deg, #f4efe2, #e9e2d2);
  --radius: 4px; --radius-card: 4px; --radius-pill: 6px 6px 0 0;
  --radius-search: 4px; --radius-tab: 0px;
  --cut: none;
  color-scheme: light;
}
/* paper grain instead of scanlines; the CRT overlay is off entirely */
html[data-theme="slip"] body::after {
  background: repeating-linear-gradient(0deg, rgba(120,100,70,.05) 0 1px, transparent 1px 4px);
  mix-blend-mode: multiply;
}
html[data-theme="slip"] .haze, html[data-theme="slip"] .grid-fx { display: none; }
/* hard offset print shadow — nothing blurred in this theme */
html[data-theme="slip"] .card {
  border: 1.5px solid var(--line); box-shadow: 3px 3px 0 rgba(42,38,32,.18);
}
html[data-theme="slip"] input, html[data-theme="slip"] textarea, html[data-theme="slip"] select {
  border: 1.5px solid var(--line); box-shadow: 2px 2px 0 rgba(42,38,32,.14);
}
/* badges are ink stamps: outlined and slightly askew */
html[data-theme="slip"] .badge {
  border: 2px solid currentColor; border-radius: 3px; font-weight: 700; padding: 2px 7px; background: transparent;
}
html[data-theme="slip"] .badge--best { color: var(--green-bright); transform: rotate(-3deg); }
html[data-theme="slip"] .badge--sale { color: var(--rust); transform: rotate(2deg); }
html[data-theme="slip"] .status-chip {
  display: inline-block; border: 2px solid var(--rust); color: var(--rust);
  font-weight: 700; font-size: 10px; padding: 2px 6px; transform: rotate(-4deg);
}
/* category pills become index-card tabs */
html[data-theme="slip"] .pill {
  border: 1.5px solid var(--line-dash); border-bottom: 0; background: #ddd4bf;
  border-radius: 6px 6px 0 0; color: var(--amber-dim);
}
html[data-theme="slip"] .pill[aria-pressed="true"] {
  background: var(--bg-panel); border-color: var(--line); color: var(--amber-bright); font-weight: 700;
}
/* tear-off strip */
html[data-theme="slip"] .add-row {
  border-top: 1.5px dashed var(--line); color: var(--rust);
  background: repeating-linear-gradient(90deg, transparent 0 12px, rgba(184,173,148,.25) 12px 24px);
}
html[data-theme="slip"] .entry { border-bottom: 1px dashed var(--line-dash); }
html[data-theme="slip"] .entry--best { border-inline-start: 4px solid var(--green); }
html[data-theme="slip"] .appbar { border-bottom: 2px dashed var(--line-dash); }
html[data-theme="slip"] .tabbar { border-top: 2px dashed var(--line-dash); }
html[data-theme="slip"] .tabbar button[aria-current="page"] {
  color: var(--amber-bright); font-weight: 700; background: transparent;
  box-shadow: inset 0 -3px 0 var(--rust);
}
html[data-theme="slip"] .leds { display: none; }
/* barcode strip under the receipt header */
html[data-theme="slip"] .appbar::after {
  content: ""; position: absolute; inset-inline: 0; bottom: -18px; height: 16px; opacity: .7;
  background: repeating-linear-gradient(90deg, #2a2620 0 2px, transparent 2px 4px, #2a2620 4px 5px, transparent 5px 9px);
  pointer-events: none;
}
html[data-theme="slip"] main { padding-top: 22px; }
html[data-theme="slip"] .fab {
  width: 58px; height: 58px; background: var(--rust); color: var(--bg-panel);
  border: 2px solid var(--line); box-shadow: 3px 3px 0 rgba(42,38,32,.3); border-radius: 50%;
}
.swatch--slip { background: linear-gradient(135deg, #e9e2d2 45%, #c8402a 45% 70%, #3e7a4e 70%); }

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* min-height, not height: a fixed-height body clips its own bottom padding out
   of the scroll area, so the last card hid behind the tab bar */
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--amber);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* must clear the fixed tab bar (65px) AND the last card's own margin,
     with room to spare — at 66px the final row sat under the bar */
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
}
/* CRT overlay — three levels, set by data-crt (see the pre-paint script) */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 900;
  background:
    repeating-linear-gradient(0deg, var(--scanline-tint) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
}
html[data-crt="off"] body::after { display: none; }
html[data-crt="subtle"] body::after {
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
}
html[data-theme="wopr"][data-crt="subtle"] body::after {
  background: repeating-linear-gradient(0deg, rgba(20,0,0,.12) 0 1px, transparent 1px 3px);
}
html[data-theme="wopr"][data-crt="full"] body::after {
  background:
    repeating-linear-gradient(0deg, var(--scanline-tint) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.55) 100%);
}
/* Smoky war-room haze — transform-only animation so it stays composited
   (animating background-position would repaint the full screen). */
.haze { display: none; }
/* 130% (not 200%): a full-screen composited layer costs width×height×4 bytes
   ×DPR², so on a DPR-3 phone the oversized version ran to tens of MB. No
   permanent will-change either — it pins the layer in GPU memory for good. */
html[data-theme="wopr"] .haze {
  display: block; position: fixed; top: -15%; left: -15%;
  width: 130%; height: 130%; pointer-events: none; z-index: 890;
  animation: drift 90s linear infinite;
  background:
    radial-gradient(circle at 30% 35%, rgba(255,59,48,.10) 0, transparent 38%),
    radial-gradient(circle at 70% 65%, rgba(255,107,94,.07) 0, transparent 34%),
    radial-gradient(circle at 50% 85%, rgba(120,20,15,.14) 0, transparent 45%);
}
@keyframes drift { 0% { transform: translate3d(0,0,0); } 50% { transform: translate3d(-4%, 3%, 0); } 100% { transform: translate3d(0,0,0); } }
@keyframes boot { 0% { opacity: 0; transform: scaleY(.6); } 40% { opacity: .6; } 100% { opacity: 1; transform: none; } }
.boot { animation: boot .45s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .boot { animation: none; }
  html[data-theme="wopr"] .haze { animation: none; }
  body::after { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%); }
}
.glow { text-shadow: 0 0 6px var(--glow); }
.num { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: .04em; }

/* WOPR perspective grid — floor of the war room */
.grid-fx { display: none; }
/* transform-animated, not background-position: moving the paint origin would
   repaint the whole strip every frame instead of just shifting a layer. */
html[data-theme="wopr"] .grid-fx {
  display: block; position: fixed; inset-inline: 0; bottom: 0; height: 34vh;
  pointer-events: none; z-index: 885; overflow: hidden;
  -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 100%);
  mask-image: linear-gradient(to top, #000 0%, transparent 100%);
}
html[data-theme="wopr"] .grid-fx::before {
  content: ""; position: absolute; inset-inline: 0; top: -28px; bottom: -28px;
  background:
    repeating-linear-gradient(90deg, rgba(255,59,48,.16) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(0deg, rgba(255,59,48,.16) 0 1px, transparent 1px 28px);
  animation: gridrun 3s linear infinite;
}
@keyframes gridrun { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, 28px, 0); } }
html[data-crt="off"] .grid-fx { display: none; }

/* ---------- app bar ---------- */
.appbar {
  position: sticky; top: 0; z-index: 60; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: 10px;
  /* physical sides: in RTL, inline-start is the right edge */
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
html[data-theme="wopr"] .appbar { border-bottom-width: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.7); }
.appbar { background: var(--panel-face); }
.appbar { flex-wrap: nowrap; }
.appbar__brand { color: var(--green); font-size: 12px; letter-spacing: .06em; font-family: var(--mono); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.appbar__title { color: var(--amber-bright); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
@media (max-width: 380px) { .appbar__brand { font-size: 11px; } .appbar__title { font-size: 12px; } }
/* indicator LEDs on the faceplate */
.leds { display: inline-flex; gap: 4px; }
.led { width: 6px; height: 6px; border-radius: 50%; background: #2a3324; }
.led--on { background: var(--green); box-shadow: 0 0 5px var(--green); }
html[data-theme="wopr"] .led { background: #3a1517; }
html[data-theme="wopr"] .led--on { background: var(--rust); box-shadow: 0 0 5px var(--rust); }
.status-chip { display: none; }
html[data-theme="wopr"] .status-chip {
  display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
  color: var(--rust); border: 1px solid var(--rust); padding: 2px 6px;
}
@keyframes glitch {
  0%, 92%, 100% { transform: translate(0); text-shadow: 0 0 6px var(--glow); }
  93% { transform: translate(1.5px, -1px); text-shadow: -1.5px 0 var(--rust), 1.5px 0 var(--green); }
  96% { transform: translate(-1.5px, 1px); text-shadow: 1.5px 0 var(--rust), -1.5px 0 var(--green); }
}
html[data-theme="wopr"] .appbar__brand { animation: glitch 5s infinite steps(1, end); }
@media (prefers-reduced-motion: reduce) {
  html[data-theme="wopr"] .appbar__brand { animation: none; }
  html[data-theme="wopr"] .grid-fx::before { animation: none; }
}
main {
  padding-block: 14px; max-width: 780px; margin: 0 auto;
  /* physical sides: in RTL, inline-start is the right edge */
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}

/* ---------- panels ---------- */
.panel {
  background: var(--bg-panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px; margin-bottom: 12px;
  box-shadow: var(--bevel);
}
html[data-theme="wopr"] .panel, html[data-theme="wopr"] .card { border-width: 2px; }
.panel__head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border-bottom: 1px solid var(--line-soft); padding-bottom: 8px; margin-bottom: 10px;
}
.panel__title { color: var(--amber-bright); font-size: 15px; }
.muted { color: var(--amber-dim); font-size: 13px; }
.tiny { font-size: 12px; }

/* ---------- buttons ---------- */
.btn {
  font: inherit; font-size: 13px; cursor: pointer; background: transparent;
  color: var(--amber); border: 1px solid var(--line); border-radius: 4px;
  padding: 9px 12px; min-height: 44px; display: inline-flex; align-items: center;
  justify-content: center; gap: 6px; letter-spacing: .03em;
}
.btn:hover { background: var(--hover-wash); }
.btn:active { transform: translateY(1px); }
/* raised keycaps */
html[data-theme="wopr"] .btn { border-width: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.75), var(--bevel); }
html[data-theme="wopr"] .btn:active { box-shadow: inset 0 2px 4px rgba(0,0,0,.8); transform: translateY(2px); }
.btn:focus-visible { outline: 2px solid var(--amber-bright); outline-offset: 2px; }
.btn--primary { border-color: var(--amber); color: var(--amber-bright); }
.btn--go { border-color: var(--green); color: var(--green-bright); }
.btn--danger { border-color: var(--rust); color: var(--rust); }
/* compact styling, but still a 44px touch target */
.btn--sm { min-height: 44px; padding: 6px 12px; font-size: 12px; }
.btn--full { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- forms ---------- */
label { display: block; font-size: 12px; color: var(--amber-dim); margin-bottom: 4px; letter-spacing: .04em; }
.picker { display: flex; gap: 8px; align-items: stretch; }
.picker input { flex: 1; min-width: 0; }
.picker .btn { flex: none; white-space: nowrap; }

input, select, textarea {
  font: inherit; font-size: 15px; width: 100%; background: var(--bg);
  color: var(--amber-bright); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 14px; min-height: 44px;
}
input[type="search"] { border-radius: var(--radius-search); padding-inline: 18px; }
html[data-theme="wopr"] input[type="search"] { clip-path: var(--cut); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 2px rgba(255,179,71,.2); }
input[type="number"] { direction: ltr; text-align: right; }
textarea { min-height: 66px; resize: vertical; }
.field { margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.check input { width: 20px; height: 20px; min-height: 20px; accent-color: var(--amber); }
.check label { margin: 0; font-size: 14px; color: var(--amber); }

/* ---------- product cards ---------- */
.card {
  position: relative; background: var(--bg-panel); border: 1px solid var(--line-soft);
  border-radius: var(--radius-card); margin-bottom: 14px; overflow: hidden;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.04);
}
/* WOPR corner brackets */
html[data-theme="wopr"] .card::before, html[data-theme="wopr"] .card::after {
  content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
  border: 2px solid var(--rust);
}
html[data-theme="wopr"] .card::before { top: -1px; inset-inline-start: -1px; border-width: 2px 0 0 2px; }
html[data-theme="wopr"] .card::after { bottom: -1px; inset-inline-end: -1px; border-width: 0 2px 2px 0; }
.card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 14px 12px; border-bottom: 1px solid var(--line-soft); }
.card__name { color: var(--amber-bright); font-size: 16px; font-weight: 600; }
.card__meta { font-size: 12px; color: var(--amber-dim); margin-top: 2px; }
.card__notes { padding: 8px 12px; font-size: 12px; color: var(--green); border-bottom: 1px solid var(--line-soft); }
.card__tools { display: flex; align-items: center; gap: 6px; }
/* 44px minimum for every tap target */
.icon-btn {
  font: inherit; font-size: 15px; background: transparent; color: var(--amber);
  border: 1px solid var(--line); border-radius: var(--radius);
  width: 44px; height: 44px; min-width: 44px; display: inline-flex;
  align-items: center; justify-content: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--hover-wash); }
.icon-btn:focus-visible { outline: 2px solid var(--amber-bright); outline-offset: 2px; }
.basis-btn { width: auto; padding: 0 10px; font-size: 12px; }
/* Two-zone row: identity at the start, the number that matters at the end. */
.entry {
  display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 10px;
  width: 100%; text-align: start; font: inherit; background: transparent;
  border: 0; border-bottom: 1px solid var(--line-soft); color: var(--amber);
  padding: 14px 12px; min-height: 56px; cursor: pointer;
  border-inline-start: 3px solid transparent;
}
.entry:last-child { border-bottom: 0; }
.entry:hover { background: var(--hover-wash); }
.entry:focus-visible { outline: 2px solid var(--amber-bright); outline-offset: -2px; }
.entry--best { background: var(--best-wash); border-inline-start-color: var(--green); }
.entry__store { font-size: 15px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.entry__pack { font-size: 12px; color: var(--amber-dim); margin-top: 3px; }
.entry__price { text-align: end; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.entry__hero { font-size: 21px; font-weight: 700; color: var(--amber-bright); line-height: 1.15; }
.entry__cap { font-size: 11px; color: var(--amber-dim); }
.entry__cap--delta { color: var(--rust); }
.entry--best .entry__hero { color: var(--green-bright); }
.entry--best .entry__store { color: var(--green-bright); }
.entry__hero--muted { font-size: 17px; color: var(--amber-dim); font-weight: 600; }
/* tappable "fill in the pack size" affordance on unmeasured rows */
.chip-fix {
  font: inherit; font-size: 12px; background: transparent; border: 0; cursor: pointer;
  color: var(--amber); text-decoration: underline dashed; text-underline-offset: 3px;
  padding: 12px 0; min-height: 44px; display: inline-flex; align-items: center;
}
.chip-fix:focus-visible { outline: 2px solid var(--amber-bright); outline-offset: 2px; }
.chip-fix:hover { color: var(--amber-bright); }
.badge { font-size: 11px; border: 1px solid currentColor; border-radius: 3px; padding: 1px 5px; }
.badge--best { background: var(--green); color: var(--best-on); border-color: var(--green); font-weight: 700; }
.badge--sale { color: var(--rust); }
.badge--warn { color: var(--amber-dim); }
.add-row { display: block; width: 100%; font: inherit; font-size: 13px; background: transparent; border: 0; border-top: 1px dashed var(--line); color: var(--amber-dim); padding: 13px 10px; min-height: 44px; cursor: pointer; }
.add-row:hover { color: var(--amber); }

/* ---------- pills / search ---------- */
/* wraps rather than scrolls — every category must stay visible */
.pills { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 6px; margin-bottom: 10px; }
.pill { flex: none; font: inherit; font-size: 13px; background: transparent; color: var(--amber-dim); border: 1px solid var(--line-soft); border-radius: var(--radius-pill); padding: 10px 14px; min-height: 44px; cursor: pointer; }
.pill:focus-visible { outline: 2px solid var(--amber-bright); outline-offset: 2px; }
html[data-theme="wopr"] .pill { clip-path: var(--cut); }
.pill--empty { font-style: italic; opacity: .8; }
.pill--more { color: var(--amber); border-style: dashed; }
.pill[aria-pressed="true"] { color: var(--bg); background: var(--amber); border-color: var(--amber); }
html[data-theme="wopr"] .pill[aria-pressed="true"] { color: #fff; background: var(--rust); border-color: var(--rust); }
html[data-theme="wopr"] .tabbar button[aria-current="page"] { box-shadow: inset 0 2px 0 var(--rust); }

/* ---------- banner ---------- */
.banner { border: 1px solid var(--rust); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; color: var(--amber-bright); font-size: 13px; }
.banner--ok { border-color: var(--green); color: var(--green-bright); }

/* ---------- verdict ---------- */
.verdict { border: 1px solid var(--green); border-radius: var(--radius); padding: 12px; background: rgba(127,176,105,.06); }
.verdict--none { border-color: var(--line); background: transparent; color: var(--amber-dim); }
.verdict__head { color: var(--green-bright); font-size: 16px; margin-bottom: 8px; }
.verdict__line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 3px 0; }

/* ---------- tabbar / fab ---------- */
.tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 80; display: flex;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
html[data-theme="wopr"] .tabbar { border-top-width: 2px; }
.tabbar { background: var(--panel-face); }
.tabbar button {
  flex: 1; font: inherit; font-size: 13px; background: transparent; border: 0;
  color: var(--amber-dim); padding: 12px 4px; min-height: 56px; cursor: pointer;
  border-radius: var(--radius-tab); margin: 4px;
}
.tabbar button[aria-current="page"] { color: var(--amber-bright); background: var(--active-wash); box-shadow: inset 0 2px 0 var(--amber); }
html[data-theme="wopr"] .tabbar button[aria-current="page"] { background: rgba(255,59,48,.14); box-shadow: inset 0 2px 0 var(--rust); }
.tabbar button:focus-visible { outline: 2px solid var(--amber-bright); outline-offset: -2px; }
/* chrome-ring dial */
.fab {
  position: fixed; inset-inline-start: 16px; bottom: calc(78px + env(safe-area-inset-bottom));
  z-index: 85; width: 60px; height: 60px; border-radius: 50%; font: inherit; font-size: 28px;
  background: radial-gradient(circle at 35% 30%, #1d2415, #0e120b);
  color: var(--amber-bright); border: 2px solid var(--amber); cursor: pointer;
  box-shadow: 0 0 14px var(--glow), inset 0 0 8px rgba(0,0,0,.8);
}
.fab:focus-visible { outline: 2px solid var(--amber-bright); outline-offset: 3px; }
html[data-theme="wopr"] .fab {
  border-radius: 0; clip-path: var(--cut); border-color: var(--rust);
  background: radial-gradient(circle at 35% 30%, #2a1012, #0a0507);
}

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-panel);
  color: var(--amber); padding: 0; width: min(440px, calc(100% - 24px)); font-family: var(--mono);
}
dialog::backdrop { background: rgba(0,0,0,.75); }
.dlg__head { padding: 12px; border-bottom: 1px solid var(--line); color: var(--amber-bright); }
.dlg__body { padding: 12px; max-height: 66vh; overflow-y: auto; }
.dlg__foot { padding: 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-start; }
.sheet-btn { display: block; width: 100%; text-align: start; font: inherit; font-size: 14px; background: transparent; border: 0; border-bottom: 1px solid var(--line-soft); color: var(--amber); padding: 14px 12px; min-height: 48px; cursor: pointer; }
.sheet-btn:hover { background: var(--hover-wash); }
.sheet-btn--danger { color: var(--rust); }
.hist { font-size: 13px; border-bottom: 1px dashed var(--line-soft); padding: 6px 0; display: flex; justify-content: space-between; gap: 8px; }
.err { color: var(--rust); font-size: 12px; min-height: 16px; }
.empty { text-align: center; color: var(--amber-dim); padding: 30px 12px; font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
/* large phones (Galaxy Ultra ~412-480px) — bigger reading size */
@media (min-width: 400px) {
  body { font-size: 16px; }
  .entry__store, .card__name { font-size: 16px; }
  .tabbar button { font-size: 14px; }
}
/* theme picker */
.theme-opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; font: inherit; font-size: 14px; background: var(--bg); color: var(--amber); border: 1px solid var(--line); border-radius: 4px; padding: 12px; min-height: 56px; margin-bottom: 8px; cursor: pointer; }
.theme-opt[aria-pressed="true"] { border-color: var(--amber-bright); color: var(--amber-bright); box-shadow: 0 0 0 1px var(--amber-bright); }
.theme-opt .swatch { flex: none; width: 34px; height: 34px; border-radius: 3px; border: 1px solid rgba(255,255,255,.15); }
.cat-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.cat-row:last-child { border-bottom: 0; }
.cat-row__name { font-size: 14px; color: var(--amber-bright); }
/* sparkline: pure divs, no SVG, no library */
.spark { display: inline-flex; align-items: flex-end; gap: 1px; width: 40px; height: 16px; vertical-align: -3px; }
.spark i { flex: 1; background: var(--amber-dim); min-height: 1px; }
.spark i:last-child { background: var(--amber-bright); }
.entry--best .spark i:last-child { background: var(--green-bright); }
.spark--low i:last-child { background: var(--green-bright); }
.spark--high i:last-child { background: var(--rust); }
/* undo toast sits above the tab bar, never over it */
/* clears the tab bar below and the FAB dial on the inline-start side */
.toast {
  position: fixed; inset-inline-end: 12px; inset-inline-start: 88px; z-index: 95;
  bottom: calc(72px + env(safe-area-inset-bottom));
  background: var(--bg-raised); border: 1px solid var(--amber);
  border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--bevel);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 13px; color: var(--amber-bright);
}
html[data-theme="wopr"] .toast { clip-path: var(--cut); border-color: var(--rust); }
.test-line { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--line-soft); }
.test-pass { color: var(--green-bright); }
.test-fail { color: var(--rust); }
.swatch--vault { background: linear-gradient(135deg, #0b0f0a 45%, #ffb347 45% 70%, #7fb069 70%); }
.swatch--wopr { background: linear-gradient(135deg, #0a0507 45%, #ff3b30 45% 70%, #ffd9b0 70%); }
</style>

<body>

<script>
/* Applied before first paint so the correct theme never flashes. */
try {
  var d0 = document.documentElement;
  var t0 = localStorage.getItem("priceTracker.theme");
  d0.dataset.theme = (t0 === "wopr" || t0 === "slip" || t0 === "hub") ? t0 : "vault";
  var c0 = localStorage.getItem("priceTracker.crt");
  d0.dataset.crt = (c0 === "off" || c0 === "full") ? c0 : "subtle";
  var m0 = document.querySelector('meta[name="theme-color"]');
  if (m0) m0.setAttribute("content",
    d0.dataset.theme === "wopr" ? "#0a0507" : d0.dataset.theme === "slip" ? "#e9e2d2"
      : d0.dataset.theme === "hub" ? "#fbf7f3" : "#0b0f0a");
} catch (e) {
  document.documentElement.dataset.theme = "vault";
  document.documentElement.dataset.crt = "subtle";
}
</script>

<div class="haze" aria-hidden="true"></div>
<div class="grid-fx" aria-hidden="true"></div>

<header class="appbar">
  <span class="appbar__brand glow">
    <span class="leds" aria-hidden="true"><i class="led led--on"></i><i class="led"></i><i class="led"></i></span>
    <span id="brand">◉ MARKET-VAULT</span>
  </span>
  <span class="appbar__title"><span class="status-chip">ONLINE</span> מעקב מחירים</span>
</header>

<main id="main" class="boot"></main>

<button class="fab" id="fab" aria-label="הוסף">+</button>

<nav class="tabbar" id="tabbar" aria-label="ניווט ראשי"></nav>

<dialog id="productDlg"><form method="dialog" id="productForm">
  <div class="dlg__head" id="productDlgTitle">מוצר</div>
  <div class="dlg__body">
    <div class="field"><label for="pName">שם המוצר</label><input id="pName" autocomplete="off" required maxlength="80"></div>
    <div class="field"><label for="pCat">קטגוריה</label>
      <div class="picker"><input id="pCat" maxlength="40" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ללא קטגוריה">
      <button type="button" class="btn btn--sm" data-pick="cat">[ בחר ]</button></div></div>
    <div class="field"><label for="pUnit">יחידת מידה להשוואה</label><select id="pUnit">
      <option value="g">משקל — ₪ ל-100 גרם</option>
      <option value="kg">משקל — ₪ לקילו</option>
      <option value="ml">נפח — ₪ ל-100 מ״ל</option>
      <option value="l">נפח — ₪ לליטר</option>
      <option value="unit">כמות — ₪ ליחידה</option>
    </select></div>
    <div class="field"><label for="pNotes">הערות</label><textarea id="pNotes" maxlength="500"></textarea></div>
    <p class="err" id="pErr"></p>
  </div>
  <div class="dlg__foot"><button class="btn btn--primary" value="save" id="pSave">[ שמור ]</button><button type="button" class="btn" id="pCancel">[ ביטול ]</button></div>
</form></dialog>

<dialog id="entryDlg"><form method="dialog" id="entryForm">
  <div class="dlg__head" id="entryDlgTitle">מחיר</div>
  <div class="dlg__body">
    <div class="field"><label for="eStore">חנות</label>
      <div class="picker"><input id="eStore" required maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="שם החנות">
      <button type="button" class="btn btn--sm" data-pick="store">[ בחר ]</button></div></div>
    <div class="grid3">
      <div class="field"><label for="eQty">כמות אריזות</label><input id="eQty" autocomplete="off" type="number" min="0" step="any" inputmode="decimal" placeholder="4"></div>
      <div class="field"><label for="eSize">גודל אריזה</label><input id="eSize" autocomplete="off" type="number" min="0" step="any" inputmode="decimal" placeholder="98"></div>
      <div class="field"><label for="eUnit">יחידה</label><select id="eUnit">
        <option value="g">גרם</option><option value="kg">ק״ג</option>
        <option value="ml">מ״ל</option><option value="l">ליטר</option>
        <option value="unit">יחידות</option>
      </select></div>
    </div>
    <div class="field"><label for="ePrice">מחיר כולל ₪</label><input id="ePrice" autocomplete="off" type="number" min="0" step="0.01" inputmode="decimal" required></div>
    <div class="check"><input type="checkbox" id="eSale"><label for="eSale">מבצע</label></div>
    <div class="field"><label for="eDate">תאריך</label><input id="eDate" type="date" required></div>
    <div class="field"><label for="eNote">הערה</label><input id="eNote" maxlength="120"></div>
    <p class="muted tiny">השאר כמות/גודל ריקים אם לא ידוע — הרשומה תוצג אך לא תשתתף בהשוואה.</p>

  var out = { version: SCHEMA_VERSION, products: [], categories: [], stores: [] };
  var v = Number(p && p.version);
  if (v && v !== 2 && v !== 3 && v !== 4 && v !== 5) return out; /* unknown schema — refuse rather than guess */
  migrateV2toV3(p);
  migrateV3toV4(p);
  migrateV4toV5(p);
  if (Array.isArray(p.categories)) {
    p.categories.forEach(function (c) {
      c = String(c || "").trim();
      if (c && out.categories.indexOf(c) === -1) out.categories.push(c);
    });
    out.categories.sort();
  }
  if (Array.isArray(p.stores)) {
    p.stores.forEach(function (c) {
      c = String(c || "").trim();
      if (c && out.stores.indexOf(c) === -1) out.stores.push(c);
    });
    out.stores.sort();
  }
  (p.products || []).forEach(function (pr) {
    if (!pr || !pr.name) return;
    var prod = {
      id: pr.id || uid("p"), name: String(pr.name), category: String(pr.category || ""),
      defaultUnit: BASES[pr.defaultUnit] ? pr.defaultUnit : "unit",
      notes: String(pr.notes || ""), migratedFrom: pr.migratedFrom || null,
      needed: !!pr.needed, entries: []
    };
    (pr.entries || []).forEach(function (e) {
      var hist = (e.history || []).filter(function (h) { return h && isFinite(Number(h.price)) && Number(h.price) >= 0; })
        .map(function (h) {
          return {
            qty: isFinite(Number(h.qty)) && Number(h.qty) > 0 ? Number(h.qty) : null,
            size: isFinite(Number(h.size)) && Number(h.size) > 0 ? Number(h.size) : null,
            unit: UNITS[h.unit] ? h.unit : null,
            price: Number(h.price), isSale: !!h.isSale, date: String(h.date || todayISO())
          };
        });
      if (!hist.length) return;
      prod.entries.push({ id: e.id || uid("e"), storeName: String(e.storeName || "?"), note: String(e.note || ""), migratedFrom: e.migratedFrom || null, history: hist });
    });
    out.products.push(prod);
  });
  return out;
}

/* ============================================================
   5. ROUTER + RENDER
   ============================================================ */
var SCREENS = [
  { id: "products", label: "מוצרים" },
  { id: "stores", label: "חנויות" },
  { id: "calc", label: "מחשבון" },
  { id: "data", label: "נתונים" }
];
var screen = "products";
var filter = { q: "", cat: "", store: "" };
var pillsExpanded = false;
var mainEl = document.getElementById("main");

function setScreen(id) {
  screen = SCREENS.some(function (s) { return s.id === id; }) ? id : "products";
  if (location.hash.slice(1) !== screen) location.hash = screen;
  render();
}
window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (h !== screen) setScreen(h); });

function renderTabs() {
  document.getElementById("tabbar").innerHTML = SCREENS.map(function (s) {
    return '<button data-screen="' + s.id + '"' + (screen === s.id ? ' aria-current="page"' : "") + ">" + esc(s.label) + "</button>";
  }).join("");
}

function renderChrome() {
  renderTabs();
  document.getElementById("fab").style.display = screen === "products" ? "" : "none";
}
function renderScreen() {
  if (screen === "products") mainEl.innerHTML = viewProducts();
  else if (screen === "stores") mainEl.innerHTML = viewStores();
  else if (screen === "calc") mainEl.innerHTML = viewCalc();
  else mainEl.innerHTML = viewData();
  if (screen === "calc") wireCalc();
  refreshDatalists();
}
/* Re-render only the results list. Keeps the search field (and its caret,
   selection and IME composition) untouched while typing. */
function renderResults() {
  var box = document.getElementById("results");
  if (!box) { renderScreen(); return; }
  box.innerHTML = productList();
}
function render() { renderChrome(); renderScreen(); }

/* ---------- products ---------- */
/* union of categories in use and user-created ones that have no products yet */
function categories() {
  var set = {};
  state.products.forEach(function (p) { if (p.category) set[p.category] = 1; });
  (state.categories || []).forEach(function (c) { if (c) set[c] = 1; });
  return Object.keys(set).sort();
}
function rankEntries(product) {
  var basis = basisOf(product);
  var rows = product.entries.map(function (e) {
    var s = cur(e), st = entryStatus(e, basis);
    return { entry: e, snap: s, status: st, up: st === "ok" ? unitPriceIn(s, basis) : null };
  });
  var ok = rows.filter(function (r) { return r.up != null; }).sort(function (a, b) { return a.up - b.up; });
  var rest = rows.filter(function (r) { return r.up == null; });

  /* Nothing is measured: rank by pack price so the card still says something,
     but flag it loudly — packs of unknown size are not comparable. */
  if (!ok.length && rows.length > 1) {
    var byPack = rows.slice().sort(function (a, b) { return a.snap.price - b.snap.price; });
    var cheapest = byPack[0].snap.price;
    byPack.forEach(function (r) { r.isPackBest = r.snap.price === cheapest; });
    return { basis: basis, rows: byPack, bestValue: null, fallback: true };
  }

  var best = ok.length ? ok[0].up : null;
  ok.forEach(function (r) { r.isBest = ok.length > 1 && r.up === best; r.deltaPct = best > 0 ? (r.up - best) / best * 100 : 0; });
  return { basis: basis, rows: ok.concat(rest), bestValue: best, fallback: false };
}

/* Migrated products default to "ליחידה" because v1 had no pack data. The first
   time a real measurement arrives in a different dimension — you type grams on
   a product still marked as units — adopt it, otherwise the row you just
   completed would read "לא ניתן להשוות" and the work would look wasted.
   An established basis (one that already has measured entries) is never hijacked. */
function adoptBasis(product, snap) {
  if (!product || !snap || !isMeasured(snap)) return;
  var newDim = UNITS[snap.unit].dim;
  var basis = basisOf(product);
  if (basis.dim === newDim) return;
  var established = product.entries.some(function (e) {
    var s = cur(e);
    return isMeasured(s) && s !== snap && UNITS[s.unit].dim === basis.dim;
  });
  if (established) return;
  product.defaultUnit = snap.unit;
}

/* bases a product can switch between, within its own dimension */
function basisOptions(product) {
  var dim = (BASES[product.defaultUnit] || BASES.unit).dim;
  if (dim === "mass") return ["g", "kg"];
  if (dim === "volume") return ["ml", "l"];
  return [];
}
function cycleBasis(productId) {
  var p = findProduct(productId);
  if (!p) return;
  var opts = basisOptions(p);
  if (opts.length < 2) return;
  var i = opts.indexOf(p.defaultUnit);
  p.defaultUnit = opts[(i + 1) % opts.length];
  save();
  renderResults(); /* list only — no full page re-render */
}

/* ---------- price history helpers (sparkline + "is this a good price?") ----------
   Everything here reads an entry's OWN history, normalized to its product's
   basis, so a pack-size change mid-history never registers as a price move. */
function historySeries(entry, basis) {
  var out = [];
  entry.history.forEach(function (h) {
    var up = unitPriceIn(h, basis);
    if (up != null) out.push({ v: up, date: h.date, unit: true });
  });
  if (out.length) return out;
  /* no measured snapshots: fall back to pack price, flagged as such */
  return entry.history.map(function (h) { return { v: h.price, date: h.date, unit: false }; });
}

function priceVerdict(entry, basis) {
  var s = historySeries(entry, basis);
  if (s.length < 2) return null;
  var vals = s.map(function (x) { return x.v; });
  var now = vals[vals.length - 1];
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var avg = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  var kind, text;
  if (now <= min) { kind = "low"; text = "הזול ביותר עד היום"; }
  else if (now >= max) { kind = "high"; text = "היקר ביותר עד היום"; }
  else if (now > avg) { kind = "high"; text = "מעל הממוצע"; }
  else { kind = "low"; text = "מתחת לממוצע"; }
  return { kind: kind, text: text, now: now, min: min, max: max, avg: avg, unit: s[0].unit, points: s.length };
}

function sparkline(entry, basis) {
  var s = historySeries(entry, basis);
  if (s.length < 2) return "";
  var vals = s.map(function (x) { return x.v; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var span = max - min;
  var v = priceVerdict(entry, basis);
  var cls = v ? " spark--" + v.kind : "";
  var bars = vals.slice(-8).map(function (n) {
    var pct = span > 0 ? Math.round(((n - min) / span) * 90) + 10 : 50;
    return '<i style="height:' + pct + '%"></i>';
  }).join("");
  return '<span class="spark' + cls + '" aria-hidden="true">' + bars + "</span>";
}

/* ---------- undo ----------
   One level, in memory only: a snapshot taken immediately before a
   destructive change. Never persisted, so it cannot resurrect stale data. */
var undoSnapshot = null, undoTimer = null;

function snapshotForUndo(label) {
  undoSnapshot = { json: JSON.stringify(state), label: label };
  showToast(label);
}
function showToast(label, withUndo) {
  hideToast();
  var el = document.createElement("div");
  el.className = "toast";
  el.id = "toast";
  el.innerHTML = '<span>' + esc(label) + '</span>' +
    (withUndo === false ? "" : '<button class="btn btn--sm" id="undoBtn">[ בטל ]</button>');
  document.body.appendChild(el);
  var btn = document.getElementById("undoBtn");
  if (btn) btn.addEventListener("click", performUndo);
  undoTimer = setTimeout(hideToast, 6000);
}
function hideToast() {
  if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  var el = document.getElementById("toast");
  if (el) el.parentNode.removeChild(el);
}
function performUndo() {
  if (!undoSnapshot) return;
  try { state = normalizeState(JSON.parse(undoSnapshot.json)); save(); }
  catch (e) { say("לא ניתן לשחזר."); return; }
  undoSnapshot = null;
  hideToast();
  render();
}

/* ---------- store rollup ----------
   Two rules keep this honest:
   1) A store only "wins" a product when the comparison was normalized —
      pack-price-only products are excluded and counted separately.
   2) The gap statistic is a MEDIAN, not a mean: one freak outlier must not
      make an otherwise expensive store look competitive. */
function storeKey(name) { return String(name || "").trim(); }

function median(nums) {
  if (!nums.length) return null;
  var a = nums.slice().sort(function (x, y) { return x - y; });
  var m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

function storeStats() {
  var stores = {};
  var comparable = 0, packOnly = 0;
  function touch(name) {
    var k = storeKey(name);
    if (!stores[k]) stores[k] = { name: k, carries: 0, wins: 0, gaps: [], lastSeen: "" };
    return stores[k];
  }
  state.products.forEach(function (p) {
    var r = rankEntries(p);
    if (r.fallback || r.bestValue == null) packOnly++; else comparable++;
    p.entries.forEach(function (e) {
      var st = touch(e.storeName), s = cur(e);
      st.carries++;
      if (s.date > st.lastSeen) st.lastSeen = s.date;
    });
    if (r.fallback || r.bestValue == null) return;
    /* reuse the card's own isBest flag: a lone comparable price is not a win,
       there was nothing to beat. Keeps this screen reconciled with the cards. */
    r.rows.forEach(function (row) {
      if (row.up == null) return;
      var st = touch(row.entry.storeName);
      if (row.isBest) st.wins++;
      else if (row.deltaPct > 0) st.gaps.push(row.deltaPct);
    });
  });
  var list = Object.keys(stores).map(function (k) {
    var s = stores[k];
    s.medianGap = median(s.gaps);
    return s;
  });
  list.sort(function (a, b) { return b.wins - a.wins || a.carries - b.carries; });
  return { stores: list, comparable: comparable, packOnly: packOnly };
}

/* ---------- shopping list / basket ----------
   Two different questions, so two different numbers:
   • packTotal — what you actually hand over at the till, summing the cheapest
     pack each store sells. Not comparable between stores selling different
     pack sizes, which is exactly why it is not shown alone.
   • fairTotal — the cost of the SAME quantity everywhere. For each product we
     pick a reference amount (the smallest measured pack anyone sells, so it is
     buyable at every store) and price it at each store's unit price.
   Products with no pack data cannot appear in fairTotal and are counted. */
function neededProducts() { return state.products.filter(function (p) { return p.needed; }); }

/* smallest measured pack across all stores, in the product's base units */
function referenceAmount(p) {
  var amounts = [];
  p.entries.forEach(function (e) {
    var s = cur(e);
    if (isMeasured(s) && UNITS[s.unit].dim === basisOf(p).dim) amounts.push(totalBase(s));
  });
  return amounts.length ? Math.min.apply(null, amounts) : null;
}

function basketFor(storeName) {
  var k = storeKey(storeName);
  var packTotal = 0, fairTotal = 0, have = 0, fairHave = 0, missing = [], unnormalized = 0;
  neededProducts().forEach(function (p) {
    var basis = basisOf(p);
    var mine = p.entries.filter(function (e) { return storeKey(e.storeName) === k; });
    if (!mine.length) { missing.push(p.name); return; }
    have++;
    packTotal += Math.min.apply(null, mine.map(function (e) { return cur(e).price; }));

    var ref = referenceAmount(p);
    var unitPrices = mine.map(function (e) { return unitPriceIn(cur(e), basis); })
                         .filter(function (u) { return u != null; });
    if (ref == null || !unitPrices.length) { unnormalized++; return; }
    /* unitPriceIn is per basis.amount base units — scale to the reference */
    fairTotal += (Math.min.apply(null, unitPrices) / basis.amount) * ref;
    fairHave++;
  });
  return { store: k, packTotal: packTotal, fairTotal: fairTotal, have: have,
           fairHave: fairHave, missing: missing, unnormalized: unnormalized };
}

function basketRanking() {
  var names = {};
  state.products.forEach(function (p) { p.entries.forEach(function (e) { names[storeKey(e.storeName)] = 1; }); });
  var list = Object.keys(names).map(basketFor).filter(function (b) { return b.have > 0; });
  var need = neededProducts().length;
  /* Full-coverage baskets first, then ranked on the fair (equal-quantity)
     total when we have one — ranking on pack price would reward small packs. */
  list.sort(function (a, b) {
    var fa = a.have === need ? 0 : 1, fb = b.have === need ? 0 : 1;
    if (fa !== fb) return fa - fb;
    if (a.fairHave && b.fairHave) return a.fairTotal - b.fairTotal;
    return a.packTotal - b.packTotal;
  });
  return { list: list, need: need };
}

/* cheapest pair of stores that together cover the list */
function bestSplit() {
  var need = neededProducts();
  if (need.length < 2) return null;
  var names = {};
  state.products.forEach(function (p) { p.entries.forEach(function (e) { names[storeKey(e.storeName)] = 1; }); });
  var keys = Object.keys(names);
  if (keys.length < 2) return null;
  function priceAt(p, k) {
    var mine = p.entries.filter(function (e) { return storeKey(e.storeName) === k; });
    if (!mine.length) return null;
    return Math.min.apply(null, mine.map(function (e) { return cur(e).price; }));
  }
  var best = null;
  for (var i = 0; i < keys.length; i++) {
    for (var j = i + 1; j < keys.length; j++) {
      var total = 0, covered = 0;
      for (var n = 0; n < need.length; n++) {
        var a = priceAt(need[n], keys[i]), b = priceAt(need[n], keys[j]);
        var pick = a == null ? b : b == null ? a : Math.min(a, b);
        if (pick == null) continue;
        total += pick; covered++;
      }
      if (covered !== need.length) continue;
      if (!best || total < best.total) best = { a: keys[i], b: keys[j], total: total, covered: covered };
    }
  }
  return best;
}

/* every entry that still has no pack data, in display order */
function incompleteEntries() {
  var out = [];
  state.products.forEach(function (p) {
    var b = basisOf(p);
    p.entries.forEach(function (e) { if (entryStatus(e, b) !== "ok") out.push({ product: p, entry: e }); });
  });
  return out;
}
/* Only a like-for-like unit-price change is a trend. Two unmeasured snapshots
   may be different pack sizes, so a raw ₪ delta between them would read as a
   price move that never happened. */
function trendOf(entry) {
  var h = entry.history;
  if (h.length < 2) return null;
  var a = h[h.length - 2], b = h[h.length - 1];
  if (!isMeasured(a) || !isMeasured(b)) return null;
  if (UNITS[a.unit].dim !== UNITS[b.unit].dim) return null;
  var pa = a.price / totalBase(a), pb = b.price / totalBase(b);
  if (pa === pb) return null;
  return { dir: pb > pa ? "up" : "down", text: Math.round(Math.abs(pb - pa) / pa * 100) + "%" };
}

function viewProducts() {
  var html = "";
  if (!storageOK) html += '<div class="banner">⚠ אחסון מקומי לא זמין — שינויים לא יישמרו. ' + esc(storageNote) + "</div>";
  else if (storageNote) html += '<div class="banner">⚠ ' + esc(storageNote) + "</div>";
  /* migration banner removed — the missing-pack-data count in נתונים and the
     inline "השלם כמות ומשקל" chips already say this where it is actionable */
  if (backupOverdue()) {
    var wasEver = !!lastExportDate();
    html += '<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      "<span>⚠ " + (wasEver
        ? "הגיבוי האחרון נשמר " + esc(ageLabel(lastExportDate())) + "."
        : "לא נשמר גיבוי. הנתונים קיימים רק במכשיר הזה.") +
      '</span><button class="btn btn--sm btn--primary" data-act="export">[ שמור גיבוי ]</button></div>';
  }

  html += '<div class="field"><label for="q">חיפוש</label><input id="q" type="search" placeholder="שם מוצר או קטגוריה" value="' + esc(filter.q) + '"></div>';
  var cats = categories();
  var counts = categoryCounts();
  var VISIBLE = 4; /* roughly one row on a 360px screen */
  var shown = pillsExpanded ? cats : cats.slice(0, VISIBLE);
  html += '<div class="pills"><button class="pill" data-cat="" aria-pressed="' + (filter.cat === "" ) + '">הכל</button>' +
    shown.map(function (c) {
      return '<button class="pill' + (counts[c] ? "" : " pill--empty") + '" data-cat="' + esc(c) +
        '" aria-pressed="' + (filter.cat === c) + '">' + esc(c) + "</button>";
    }).join("");
  if (cats.length > VISIBLE) {
    html += '<button class="pill pill--more" data-act="pills-toggle" aria-expanded="' + pillsExpanded + '">' +
      (pillsExpanded ? "פחות ▴" : "עוד " + (cats.length - VISIBLE) + " ▾") + "</button>";
  }
  html += "</div>";

  /* store filter arrives from the חנויות screen; it stacks with the category
     pills rather than replacing them, so show it as a clearable chip */
  if (filter.store) {
    html += '<div class="banner banner--ok" style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      "<span>מסונן לחנות: " + esc(filter.store) + "</span>" +
      '<button class="btn btn--sm" data-act="store-clear">[ נקה ]</button></div>';
  }
  html += '<button class="btn btn--sm btn--full" data-act="paste-open" style="margin-bottom:12px">[ 📷 הוסף מצילום · דרך Claude ]</button>';
  return html + '<div id="results">' + productList() + "</div>";
}

/* the results list alone — re-rendered on its own while searching */
function productList() {
  var html = "";
  var q = filter.q.trim().toLowerCase();
  var list = state.products.filter(function (p) {
    if (filter.cat && p.category !== filter.cat) return false;
    if (filter.store && !p.entries.some(function (e) { return storeKey(e.storeName) === filter.store; })) return false;
    if (!q) return true;
    return (p.name + " " + p.category + " " + p.entries.map(function (e) { return e.storeName; }).join(" ")).toLowerCase().indexOf(q) > -1;
  });
  if (!list.length) return '<div class="empty">אין מוצרים להצגה.<br>לחץ + כדי להוסיף מוצר חדש.</div>';

  list.forEach(function (p) {
    var r = rankEntries(p);
    var opts = basisOptions(p);
    html += '<article class="card" id="card_' + esc(p.id) + '">';
    html += '<div class="card__head"><div><div class="card__name">' + (p.needed ? "🛒 " : "▸ ") + esc(p.name) + '</div><div class="card__meta">' +
      esc(p.category || "ללא קטגוריה") + " · " +
      (r.fallback ? "השוואה: מחיר אריזה — לא מנורמל" : "השוואה " + esc(r.basis.label)) +
      '</div></div>' +
      '<div class="card__tools">' +
      (opts.length > 1 ? '<button class="icon-btn basis-btn" data-act="basis" data-p="' + esc(p.id) +
        '" title="שנה בסיס השוואה" aria-label="שנה בסיס השוואה">' + esc(r.basis.label) + "</button>" : "") +
      '<button class="icon-btn" data-act="product-menu" data-p="' + esc(p.id) + '" aria-label="פעולות למוצר">···</button>' +
      "</div></div>";
    if (p.notes) html += '<div class="card__notes">' + esc(p.notes) + "</div>";

    r.rows.forEach(function (row) {
      var s = row.snap, tr = trendOf(row.entry);
      /* a div, not a button: the row can contain its own button (the fix chip),
         and nested <button> is invalid and unreachable by keyboard */
      html += '<div class="entry' + (row.isBest ? " entry--best" : "") + '" role="button" tabindex="0" data-act="entry-menu" data-p="' + esc(p.id) + '" data-e="' + esc(row.entry.id) + '">';

      /* start: who and what */
      html += '<span><span class="entry__store">' + esc(row.entry.storeName) +
        (s.isSale ? ' <span class="badge badge--sale">מבצע</span>' : "") +
        (row.isBest ? ' <span class="badge badge--best">★ הכי משתלם</span>' : "") +
        (row.isPackBest ? ' <span class="badge badge--warn">הזול באריזה</span>' : "") + "</span>";
      var spark = sparkline(row.entry, r.basis);
      html += '<span class="entry__pack">' + esc(packLabel(s)) +
        (row.entry.note ? " · " + esc(row.entry.note) : "") +
        (tr ? ' · <span class="' + (tr.dir === "up" ? "entry__cap--delta" : "") + '">' + (tr.dir === "up" ? "▲" : "▼") + " " + esc(tr.text) + "</span>" : "") +
        " · " + esc(ageLabel(s.date)) + (spark ? " " + spark : "") + "</span></span>";

      /* end: the number that decides */
      html += '<span class="entry__price">';
      if (row.up != null) {
        html += '<span class="entry__hero num">' + moneyU(row.up) + "</span>";
        html += '<span class="entry__cap">' + esc(r.basis.label) + ' · <span class="num">' + money(s.price) + "</span> לחבילה</span>";
        if (!row.isBest && row.deltaPct > 0) html += '<span class="entry__cap entry__cap--delta num">+' + row.deltaPct.toFixed(1) + "%</span>";

/* ---------- calculator ---------- */
var calcState = [
  { qty: "", size: "", unit: "g", price: "" },
  { qty: "", size: "", unit: "g", price: "" },
  { qty: "", size: "", unit: "g", price: "" }
];
var calcCount = 2;

function offerPanel(i) {
  var o = calcState[i], letter = ["A", "B", "C"][i];
  return '<div class="panel"><div class="panel__head"><span class="panel__title">הצעה ' + letter + '</span></div>' +
    '<div class="grid3">' +
    '<div class="field"><label for="c' + i + 'q">כמות</label><input id="c' + i + 'q" data-c="' + i + '" data-f="qty" type="number" min="0" step="any" inputmode="decimal" value="' + esc(o.qty) + '" placeholder="4"></div>' +
    '<div class="field"><label for="c' + i + 's">גודל</label><input id="c' + i + 's" data-c="' + i + '" data-f="size" type="number" min="0" step="any" inputmode="decimal" value="' + esc(o.size) + '" placeholder="98"></div>' +
    '<div class="field"><label for="c' + i + 'u">יחידה</label><select id="c' + i + 'u" data-c="' + i + '" data-f="unit">' +
      Object.keys(UNITS).map(function (u) { return '<option value="' + u + '"' + (o.unit === u ? " selected" : "") + ">" + esc(UNITS[u].label) + "</option>"; }).join("") +
    "</select></div></div>" +
    '<div class="field"><label for="c' + i + 'p">מחיר כולל ₪</label><input id="c' + i + 'p" data-c="' + i + '" data-f="price" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(o.price) + '" placeholder="24.90"></div>' +
    '<div class="btn-row"><button class="btn btn--sm" data-act="calc-load" data-i="' + i + '">[ טען מהמאגר ]</button>' +
    '<button class="btn btn--sm" data-act="calc-clear-one" data-i="' + i + '">[ נקה הצעה ]</button></div>' +
    "</div>";
}

function calcOffer(i) {
  var o = calcState[i];
  var qty = num(o.qty), size = num(o.size), price = num(o.price);
  if (!(qty > 0) || !(size > 0) || !(price > 0) || !UNITS[o.unit]) return null;
  return { i: i, letter: ["A", "B", "C"][i], dim: UNITS[o.unit].dim, base: qty * size * UNITS[o.unit].base, price: price };
}
function calcVerdict() {
  var offers = [];
  for (var i = 0; i < calcCount; i++) { var o = calcOffer(i); if (o) offers.push(o); }
  if (offers.length < 2) return { kind: "incomplete" };
  var dim = offers[0].dim;
  if (offers.some(function (o) { return o.dim !== dim; })) return { kind: "mixed" };
  var basis = dim === "mass" ? BASES.g : dim === "volume" ? BASES.ml : BASES.unit;
  offers.forEach(function (o) { o.up = o.price / o.base * basis.amount; });
  var sorted = offers.slice().sort(function (a, b) { return a.up - b.up; });
  var best = sorted[0], worst = sorted[sorted.length - 1];
  var tie = sorted.every(function (o) { return Math.abs(o.up - best.up) < 1e-9; });
  return { kind: tie ? "tie" : "ok", basis: basis, sorted: sorted, best: best, worst: worst,
    savePct: best.up > 0 ? (worst.up - best.up) / worst.up * 100 : 0,
    saveAbs: (worst.up - best.up) * (worst.base / basis.amount) };
}

function viewCalc() {
  /* Actions live in the header, not after the offers. Below the fields the
     clear button sat at y≈904 on a 915px screen — behind the tab bar, reachable
     only by scrolling past every input, so it may as well not have existed. */
  var html = '<div class="panel"><div class="panel__head"><span class="panel__title">מחשבון כדאיות</span>' +
    '<span class="btn-row">' +
    (calcCount < 3 ? '<button class="btn btn--sm" id="addOffer">[ + הצעה ]</button>' : "") +
    '<button class="btn btn--sm" id="clearCalc">[ נקה הכל ]</button></span></div>' +
    '<p class="muted tiny" style="margin:0">הזן שתי הצעות או יותר — המחשבון ישווה מחיר ליחידה ויגיד מה משתלם.</p></div>';
  html += '<div id="verdict">' + verdictHtml() + "</div>";
  for (var i = 0; i < calcCount; i++) html += offerPanel(i);
  return html;
}
function verdictHtml() {
  var v = calcVerdict();
  if (v.kind === "incomplete") return '<div class="verdict verdict--none">מלא לפחות שתי הצעות (כמות, גודל, מחיר).</div>';
  if (v.kind === "mixed") return '<div class="verdict verdict--none">לא ניתן להשוות — ההצעות במידות שונות (משקל מול נפח מול יחידות).</div>';
  var head = v.kind === "tie" ? "תיקו — אותו מחיר ליחידה" : "הצעה " + v.best.letter + " ★ משתלמת יותר";
  var html = '<div class="verdict"><div class="verdict__head glow">' + esc(head) + "</div>";
  v.sorted.forEach(function (o) {
    html += '<div class="verdict__line"><span>הצעה ' + o.letter + (o === v.best && v.kind === "ok" ? " ★" : "") + '</span>' +
      '<span class="num">' + moneyU(o.up) + " " + esc(v.basis.label) + "</span></div>";
  });
  if (v.kind === "ok") {
    html += '<div class="verdict__line" style="border-top:1px solid var(--line-soft);margin-top:6px;padding-top:6px">' +
      "<span>חיסכון מול היקרה</span><span class=\"num\">" + v.savePct.toFixed(1) + "% · " + money(v.saveAbs) + " על כמות זהה</span></div>";
    html += '<button class="btn btn--sm btn--go btn--full" data-act="calc-save" data-i="' + v.best.i + '" style="margin-top:10px">[ שמור את ' + v.best.letter + " כמחיר במאגר ]</button>";
  }
  return html + "</div>";
}
/* Wired once for the life of the page. Re-adding on every visit to the
   calculator tab stacked duplicate handlers, so each keystroke fired
   saveCalc() and a verdict re-render N times. */
document.addEventListener("input", calcInput);
document.addEventListener("change", calcInput);

function wireCalc() {
  var add = document.getElementById("addOffer");
  if (add) add.addEventListener("click", function () { calcCount = 3; saveCalc(); render(); });
  document.getElementById("clearCalc").addEventListener("click", function () {
    calcState = calcState.map(function () { return { qty: "", size: "", unit: "g", price: "" }; });
    calcCount = 2; saveCalc(); render();
  });
}
function calcInput(ev) {
  var t = ev.target;
  if (!t || t.dataset.c == null) return;
  calcState[Number(t.dataset.c)][t.dataset.f] = t.value;
  saveCalc();
  var v = document.getElementById("verdict");
  if (v) v.innerHTML = verdictHtml();
}

function loadCalc() {
  try {
    var c = JSON.parse(lsGet(KEY_CALC) || "null");
    if (!c || !Array.isArray(c.offers)) return;
    for (var i = 0; i < 3; i++) {
      var o = c.offers[i];

}

/* Resolve on the button's own click rather than the dialog "close" event:

   which would leave the promise pending and silently drop the action. */
function askChoice(text, buttons) {
  return new Promise(function (resolve) {
    document.getElementById("askText").textContent = text;
    var foot = document.getElementById("askFoot");
    foot.innerHTML = buttons.map(function (b, i) {
      return '<button type="button" class="btn ' + (b.cls || "") + '" data-choice="' + i + '">[ ' + esc(b.label) + " ]</button>";
    }).join("");
    var done = false;
    function finish(val) {
      if (done) return;
      done = true;
      foot.removeEventListener("click", onClick);

/* ---------- add from a photo, via Claude ----------
   The app never touches a network or a camera: you photograph the item in
   Claude, Claude returns one line of JSON, you paste it here. All parsing,
   validation and storage stay local. */
var PASTE_PROMPT =
  "קרא את המוצר בתמונה והחזר JSON בלבד, בלי טקסט נוסף, במבנה הזה:\n" +
  '{"name":"שם המוצר","category":"קטגוריה","qty":1,"size":98,"unit":"g","note":"מותג/פרטים"}\n' +
  'unit חייב להיות אחד מ: g, kg, ml, l, unit. qty = מספר האריזות במארז, size = הגודל של אריזה אחת. אל תנחש מחיר.';

var pasteDlg = document.getElementById("pasteDlg");

/* Accepts the JSON Claude returns, tolerating stray prose or code fences. */
function parseProductPaste(text) {
  if (!text || !text.trim()) return { error: "אין מה להדביק." };
  var raw = String(text).replace(/```[a-z]*/gi, "").trim();
  var start = raw.indexOf("{"), end = raw.lastIndexOf("}");
  if (start === -1 || end === -1 || end < start) return { error: "לא נמצא JSON בתשובה." };
  var obj;
  try { obj = JSON.parse(raw.slice(start, end + 1)); }
  catch (e) { return { error: "ה-JSON אינו תקין." }; }
  if (!obj || typeof obj !== "object") return { error: "מבנה לא מוכר." };

  var name = String(obj.name || "").trim();
  if (!name) return { error: "חסר שם מוצר." };

  var unit = UNITS[obj.unit] ? obj.unit : null;
  var qty = Number(obj.qty), size = Number(obj.size);
  qty = isFinite(qty) && qty > 0 ? qty : null;
  size = isFinite(size) && size > 0 ? size : null;
  if (qty === null || size === null || !unit) { qty = null; size = null; unit = null; }

  return {
    data: {
      name: name,
      category: String(obj.category || "").trim(),
      note: String(obj.note || "").trim(),
      qty: qty, size: size, unit: unit,
      defaultUnit: unit === "kg" ? "kg" : unit === "l" ? "l" : unit || "unit"
    }
  };
}

function openPasteDialog() {
  document.getElementById("pastePrompt").value = PASTE_PROMPT;
  document.getElementById("pasteIn").value = "";
  document.getElementById("pasteErr").textContent = "";

}

document.getElementById("copyPrompt").addEventListener("click", function () {

document.getElementById("pasteIn").addEventListener("input", function () {

  err.textContent = "";

function openPicker(kind) {

/* ---------- text prompt (category create / rename) ---------- */
var promptDlg = document.getElementById("promptDlg");

/* ---------- category management ---------- */
function categoryCounts() {
  var map = {};

/* One product per name, app-wide. Two rows called "חזה עוף" are not just

   was now filtered out, which reads as "moving categories does nothing". */
function filterHidesProduct(product) {
  if (!product) return false;
  if (filter.cat && product.category !== filter.cat) return true;
  if (filter.store && !product.entries.some(function (e) { return storeKey(e.storeName) === filter.store; })) return true;
  return false;
}

function productNameTaken(name, exceptId) {

}

    return null;

/* ---------- complete-the-data queue ---------- */

function startFillQueue() {

function nextInQueue() {

    : (mode === "add" ? "מחיר חדש · " + product.name : mode === "update" ? "עדכון מחיר · " + product.name : "עריכת רשומה · " + product.name);

entryForm.addEventListener("submit", function (ev) {

  if (!isFinite(price) || price <= 0) { ev.preventDefault(); err.textContent = "מחיר חייב להיות גדול מאפס."; return; }
  if (qty !== null && (!isFinite(qty) || qty <= 0)) { ev.preventDefault(); err.textContent = "כמות חייבת להיות גדולה מאפס."; return; }
  if (size !== null && (!isFinite(size) || size <= 0)) { ev.preventDefault(); err.textContent = "גודל אריזה חייב להיות גדול מאפס."; return; }
  /* a count-based item has no meaningful pack size: 6 יחידות is complete on its own */
  if (qty !== null && size === null && document.getElementById("eUnit").value === "unit") size = 1;
  if ((qty === null) !== (size === null)) { ev.preventDefault(); err.textContent = "מלא גם כמות וגם גודל אריזה, או השאר את שניהם ריקים."; return; }
  if (!date) { ev.preventDefault(); err.textContent = "נדרש תאריך."; return; }

  var snap = { qty: qty, size: size, unit: qty === null ? null : document.getElementById("eUnit").value, price: price, isSale: document.getElementById("eSale").checked, date: date };
  var note = document.getElementById("eNote").value.trim();
  var c = entryCtx;
  if (c.mode === "add") {
    c.product.entries.push({ id: uid("e"), storeName: store, note: note, history: [snap] });
  } else if (c.mode === "update") {
    c.entry.storeName = store; c.entry.note = note; c.entry.history.push(snap);
  } else {
    c.entry.storeName = store; c.entry.note = note; c.entry.history[c.entry.history.length - 1] = snap;
  }
  adoptBasis(c.product, snap);
  save();
  if (fillQueue) { fillQueue.idx++; setTimeout(nextInQueue, 60); }
  else setTimeout(render, 0);
});

/* ============================================================
   7. EXPORT / IMPORT
   ============================================================ */
/* This data lives in exactly one browser on one phone. Clearing site data,
   losing the phone, or Android reclaiming storage takes all of it, and the
   export button only helps if someone remembers to press it — so the app
   tracks when a copy was last saved and asks when that goes stale. */
var KEY_EXPORTED = "priceTracker.lastExport";
var BACKUP_NAG_DAYS = 30;

function lastExportDate() {
  var v = lsGet(KEY_EXPORTED);
  /* localStorage stringifies anything, so a stray null becomes "null" */
  return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : "";
}
function backupAgeDays() { return ageDays(lastExportDate()); }
function backupOverdue() {
  if (!state.products.length) return false;      /* nothing to lose yet */
  var d = backupAgeDays();
  return d === null || d > BACKUP_NAG_DAYS;      /* never exported, or long ago */
}

function doExport() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "market-vault-" + todayISO() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  lsSet(KEY_EXPORTED, todayISO());
  render();
}
function validateImport(text) {
  var parsed;
  try { parsed = JSON.parse(text); } catch (e) { return { error: "הקובץ אינו JSON תקין." }; }
  if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.products)) return { error: "מבנה קובץ לא מוכר — חסרה רשימת products." };
  if (!parsed.products.length) return { error: "הקובץ אינו מכיל מוצרים." };
  var isV1 = parsed.products.some(function (p) { return Array.isArray(p.stores); });
  var next = isV1 ? migrateV1(parsed) : normalizeState(parsed);
  if (!next.products.length) return { error: "לא נמצאו רשומות תקינות בקובץ." };
  return { data: next, isV1: isV1 };
}
/* pack fields are part of the identity: the same store/date/price can be two
   genuinely different pack sizes, and a re-import after a price edit must not
   collapse onto the old row. */
function entryKey(prodName, e) {
  var s = cur(e);
  return [prodName, e.storeName, s.date, s.price, s.qty, s.size, s.unit].join("|");
}
function mergeInto(base, incoming) {
  var byName = {};
  if (!Array.isArray(base.categories)) base.categories = [];
  (incoming.categories || []).forEach(function (c) {
    if (c && base.categories.indexOf(c) === -1) base.categories.push(c);
  });
  base.categories.sort();
  base.products.forEach(function (p) { byName[p.name] = p; });
  incoming.products.forEach(function (ip) {
    var target = byName[ip.name];
    if (!target) { base.products.push(ip); byName[ip.name] = ip; return; }
    var seen = {};
    target.entries.forEach(function (e) { seen[entryKey(target.name, e)] = 1; });
    ip.entries.forEach(function (e) { if (!seen[entryKey(ip.name, e)]) target.entries.push(e); });
    if (!target.notes && ip.notes) target.notes = ip.notes;
  });
  return base;
}
function handleImportFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var res = validateImport(String(reader.result));
    if (res.error) { say("הייבוא בוטל — " + res.error + " הנתונים הקיימים לא השתנו."); return; }
    chooseImportMode().then(function (mode) {
      if (mode !== "merge" && mode !== "replace") return;
      lsSet(KEY_BACKUP, JSON.stringify(state));
      undoSnapshot = { json: JSON.stringify(state), label: "ייבוא" };
      state = mode === "replace" ? res.data : mergeInto(state, res.data);
      save(); migratedBanner = res.isV1; render();
      say(mode === "replace" ? "הנתונים הוחלפו. גיבוי של המצב הקודם נשמר." : "הייבוא מוזג. גיבוי של המצב הקודם נשמר.")
        .then(function () { showToast(mode === "replace" ? "הנתונים הוחלפו" : "הייבוא מוזג"); });
    });
  };
  reader.onerror = function () { say("לא ניתן לקרוא את הקובץ."); };
  reader.readAsText(file);
}
function doRestore() {
  var raw = lsGet(KEY_BACKUP);
  if (!raw) { say("אין גיבוי זמין."); return; }
  ask("לשחזר את הגיבוי האחרון? המצב הנוכחי יידרס.", "שחזר", true).then(function (yes) {
    if (!yes) return;
    try { state = normalizeState(JSON.parse(raw)); save(); render(); say("הגיבוי שוחזר."); }
    catch (e) { say("הגיבוי פגום ולא ניתן לשחזור."); }
  });
}
