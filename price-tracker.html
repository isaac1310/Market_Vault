/* run calcVerdict against temporary offers without disturbing the user's inputs */
function withCalc(offers, fn) {
  var savedState = calcState, savedCount = calcCount;
  calcState = offers.map(function (o) { return { qty: String(o.qty), size: String(o.size), unit: o.unit, price: String(o.price) }; });
  while (calcState.length < 3) calcState.push({ qty: "", size: "", unit: "g", price: "" });
  calcCount = offers.length;
  try { return fn(); }
  finally { calcState = savedState; calcCount = savedCount; }
}

function runSelfTest(silent) {
  var results = selfTests().map(function (spec) {
    var ok = false, note = "";
    try { ok = spec.fn() === true; }
    catch (e) { ok = false; note = String(e && e.message || e); }
    return { name: spec.name, ok: ok, note: note };
  });
  var failed = results.filter(function (r) { return !r.ok; });
  testReport = { version: APP_VERSION, total: results.length, failed: failed.length, results: results };
  lsSet(KEY_TESTED, APP_VERSION);
  if (failed.length) {
    try { console.error("Sanity tests failed:", failed.map(function (f) { return f.name; })); } catch (e) {}
  }
  if (!silent) { setScreen("data"); render(); }
  return testReport;
}
/* console entry point so the suite stays runnable without any UI */
window.__selftest = function () {
  var r = runSelfTest(true);
  try {
    console.log("MARKET-VAULT " + APP_VERSION + " — " + (r.total - r.failed) + "/" + r.total + " passed");
    r.results.forEach(function (x) { if (!x.ok) console.warn("FAIL: " + x.name + (x.note ? " — " + x.note : "")); });
  } catch (e) {}
  return r;
};

/* ============================================================
   8. EVENTS
   ============================================================ */
document.addEventListener("click", function (ev) {
  var t = ev.target;
  var tab = t.closest("[data-screen]");
  if (tab) { setScreen(tab.dataset.screen); return; }
  var pill = t.closest(".pill[data-cat]");
  if (pill) { filter.cat = pill.dataset.cat; render(); return; }
  var pick = t.closest("[data-pick]");
  if (pick) { openPicker(pick.dataset.pick); return; }
  var act = t.closest("[data-act]");
  if (!act) return;
  var a = act.dataset.act;
  if (a === "product-menu") { productMenu(findProduct(act.dataset.p)); }
  else if (a === "entry-add") { openEntry("add", findProduct(act.dataset.p)); }
  else if (a === "entry-menu") { var p = findProduct(act.dataset.p); entryMenu(p, findEntry(p, act.dataset.e)); }
  else if (a === "theme") { setTheme(act.dataset.t); }
  else if (a === "crt") { setCrt(act.dataset.v); }
  else if (a === "basis") { cycleBasis(act.dataset.p); }
  else if (a === "pills-toggle") { pillsExpanded = !pillsExpanded; render(); }
  else if (a === "fill-queue") { startFillQueue(); }
  else if (a === "fix-entry") {
    ev.stopPropagation();
    var fp = findProduct(act.dataset.p);
    openEntry("edit", fp, findEntry(fp, act.dataset.e));
  }
  else if (a === "paste-open") { openPasteDialog(); }
  else if (a === "calc-load") { calcLoadFrom(Number(act.dataset.i)); }
  else if (a === "calc-clear-one") { clearCalcOffer(Number(act.dataset.i)); }
  else if (a === "calc-save") { calcSaveAsEntry(Number(act.dataset.i)); }
  else if (a === "store-filter") { filter.store = act.dataset.s; filter.cat = ""; setScreen("products"); }
  else if (a === "store-clear") { filter.store = ""; render(); }
  else if (a === "cat-merge") { mergeCategory(act.dataset.c); }
  else if (a === "store-add") { addStore(); }
  else if (a === "store-rename") { renameStore(act.dataset.s); }
  else if (a === "store-merge") { mergeStore(act.dataset.s); }
  else if (a === "store-del") { deleteStore(act.dataset.s); }
  else if (a === "cat-add") { addCategory(); }
  else if (a === "cat-rename") { renameCategory(act.dataset.c); }
  else if (a === "cat-del") { deleteCategory(act.dataset.c); }
  else if (a === "selftest") { runSelfTest(); }
  else if (a === "export") { doExport(); }
  else if (a === "import") { document.getElementById("importFile").click(); }
  else if (a === "restore") { doRestore(); }
});
document.addEventListener("change", function (ev) {
  if (ev.target.id === "importFile" && ev.target.files && ev.target.files[0]) {
    handleImportFile(ev.target.files[0]); ev.target.value = "";
  }
});
/* Esc must close the topmost dialog. showModal() is supposed to do this
   natively, but the same engines that never fire `close` on a dialog-form
   submit also swallow Esc — so route it through each dialog's own cancel
   path, which keeps queue state and pending promises consistent. */
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Escape" && ev.key !== "Esc") return;
  var stack = [productDlg, entryDlg, sheetDlg, pasteDlg, promptDlg, askDlg];
  var open = stack.filter(function (d) { return d && d.open; });
  if (!open.length) return;
  ev.preventDefault();
  var d = open[open.length - 1];
  if (d === productDlg) productDlg.close("cancel");
  else if (d === entryDlg) document.getElementById("eCancel").click();
  else if (d === promptDlg) document.getElementById("promptCancel").click();
  else if (d === askDlg) d.dispatchEvent(new Event("cancel")); /* resolves its promise */
  else d.close();
});

/* role="button" rows must answer Enter and Space like a real button */
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  var el = ev.target.closest && ev.target.closest('[role="button"]');
  if (!el) return;
  ev.preventDefault();
  el.click();
});

var searchTimer = null;
document.addEventListener("input", function (ev) {
  if (ev.target.id !== "q") return;
  filter.q = ev.target.value;
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(function () { searchTimer = null; renderResults(); }, 120);
});
document.getElementById("fab").addEventListener("click", function () { openProduct(null); });

  if (boot.failed) storageNote = "בדיקת שפיות נכשלה (" + boot.failed + "/" + boot.total + ") — ראה מסך נתונים.";
}
setScreen(location.hash.slice(1) || "products");
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  try { navigator.serviceWorker.register("./sw.js"); } catch (e) {}
}
